services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: enrich
      POSTGRES_PASSWORD: enrich
      POSTGRES_DB: enrichment
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrich -d enrichment"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://enrich:enrich@db:5432/enrichment
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      CORS_ORIGINS: http://localhost:3002
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3002:3000"
    depends_on:
      - backend

volumes:
  pgdata:
